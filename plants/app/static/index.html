<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plants</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="bar">
    <a class="bar-back" id="back" href="#/" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="bar-title" id="title">Plants</h1>
    <a class="bar-action" id="photo-link" href="#/photo" aria-label="Take a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </a>
    <a class="bar-action" id="settings-link" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </a>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <input type="text" id="modal-input" hidden aria-label="Name">
      <div class="modal-actions">
        <button type="button" class="btn" id="modal-no">Cancel</button>
        <button type="button" class="btn danger" id="modal-yes">Remove</button>
      </div>
    </div>
  </div>
  <script src="static/app.js"></script>
</body>
</html>
